# Local fixtures only. Future Traefik integration must not publish an app port.
services:
  brain:
    build: .
    image: markdown-brain:local
    init: true
    environment:
      AUTH_CONFIG: /config/auth.json
      HTTP_ALLOWED_HOSTS: localhost,127.0.0.1,[::1]
      NODE_OPTIONS: --max-old-space-size=384
    ports:
      - "127.0.0.1:8181:3000"
    volumes:
      - fixture-notes:/data/notes
      - fixture-state:/data/state
      - type: bind
        source: ./.local/config
        target: /config
        read_only: true
        bind:
          create_host_path: false
    read_only: true
    mem_limit: 768m
    memswap_limit: 768m
    cpus: 1.0
    pids_limit: 128
    tmpfs:
      - /tmp:size=64m,mode=1777
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    stop_grace_period: 60s

volumes:
  fixture-notes:
  fixture-state:
